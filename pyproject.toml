[project]
name = "quest-splat-bridge"
version = "0.1.0.dev1"
description = "Local Quest capture bridge and project library"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<13",
  "numpy>=2,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
numerical-test = ["plyfile==1.1.5", "scipy==1.15.3", "opencv-python-headless>=4.10,<5"]
mesh = ["pymeshlab==2025.7.post1", "plyfile==1.1.5", "open3d==0.19.0", "scipy==1.15.3"]

[project.scripts]
quest-splat-bridge = "bridge.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests/bridge", "tests/blender"]
