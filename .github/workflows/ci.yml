name: Source compatibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QUEST_NERFSTUDIO_PYTHON: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/audit-publication.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,numerical-test]"
      - run: npm ci --prefix tools/splat-transform --ignore-scripts --no-audit --no-fund
      - run: python -m pytest -q -ra -p no:cacheprovider
      - run: npm test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./quest/tests/Test-PrepareQuestUnity.ps1
      - run: quest-splat-bridge --help
